[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kohaku-py"
version = "0.2.2"
description = "Python privacy SDK & sovereign wallet engine for Ethereum: Tornado Cash, 0xBow Privacy Pools, Railgun 0zk UTXOs, ERC-5564 Stealth Addresses, and Saga Sync"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "roru" }
]
keywords = [
    "ethereum",
    "privacy",
    "zero-knowledge",
    "tornado-cash",
    "privacy-pools",
    "railgun",
    "eip-7702",
    "erc-4337",
    "zk-snarks",
    "saga-sync",
    "merkle-tree",
    "mimc",
    "poseidon"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "circomlibpy>=1.0.0",
    "eth-hash[pycryptodome]>=0.8.0",
    "eth-account>=0.11.0",
    "eth-abi>=5.0.0",
    "eth-keys>=0.5.0",
    "py-ecc>=7.0.0",
    "rlp>=4.0.0",
    "textual>=8.0.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
kohaku = "kohaku.cli:main"
edw-py = "kohaku.cli:main"
edw = "kohaku.edw.cli:main"

